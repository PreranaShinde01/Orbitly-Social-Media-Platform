<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="orbitlyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="orbitlyRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Chat Bubble Body -->
  <path d="M14 12C14 7.58172 17.5817 4 22 4H42C46.4183 4 50 7.58172 50 12V32C50 36.4183 46.4183 40 42 40H26L16 48V40H14C9.58172 40 6 36.4183 6 32V20C6 15.5817 9.58172 12 14 12Z" 
