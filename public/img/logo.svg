  <!-- Orbiting Satellite Dot / Spark -->
  <circle cx="44" cy="15" r="4.2" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="44" cy="15" r="2.2" fill="#EC4899"/>
