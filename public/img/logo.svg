        filter="url(#glow)"/>

  <!-- Inner Soft Glow/Highlight -->
  <path d="M14 6C10.6863 6 8 8.68629 8 12V28C8 31.3137 10.6863 34 14 34H18V42.5L27 34H42C45.3137 34 48 31.3137 48 28V12C48 8.68629 45.3137 6 42 6H14Z" 
        fill="white" 
        fill-opacity="0.08"/>

  <!-- Tilted Orbit Ring -->
  <ellipse cx="28" cy="22" rx="19" ry="8.5" 
